<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;background:#f4f5f7;color:#333;padding:16px}

.bar input.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.bar input.search:focus{outline:none;border-color:#404040}
.btn{padding:9px 16px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}
.btn:focus-visible{outline:2px solid #404040;outline-offset:2px}
.btn-copy{background:#2e7d32;color:#fff}.btn-copy:hover{background:#256528}
.btn-clear{background:#ddd;color:#555}.btn-clear:hover{background:#ccc}
.btn-add{background:#1565c0;color:#fff}.btn-add:hover{background:#0d4a93}
.btn-exp{background:#6a5acd;color:#fff}.btn-exp:hover{background:#5546b8}
.btn-imp{background:#e65100;color:#fff}.btn-imp:hover{background:#bf4400}

thead th{background:#EEECE1;color:#333;font-weight:bold;padding:10px 8px;text-align:left;position:sticky;top:0;border-bottom:1px solid #BFBFBF;white-space:nowrap}

.code{color:#888;font-family:monospace;white-space:nowrap}

td.upd{color:#999;font-size:11px;font-family:monospace;white-space:nowrap}

.g설치법인{background:#fff3e0;color:#e65100}.g일반점{background:#e3f2fd;color:#1565c0}
.g직영점{background:#f3e5f5;color:#6a1b9a}.g대행점{background:#e0f2f1;color:#00695c}

.selbar.show{display:block}
.selbar .info{font-size:13px;color:#666;margin-bottom:8px}

<body>
<div class="wrap">

<div class="sub">최종 수정일 <span class="updated" id="lastupd">-</span> &nbsp;|&nbsp; 이메일 다중 선택 복사 · 검색</div>

<b>서버 설정이 비어 있습니다.</b> 파일 상단 <code>SUPABASE_URL</code> · <code>SUPABASE_ANON_KEY</code> 값을 확인하세요.

<div class="toprow">
<div class="tabs" id="tabs"></div>
<div class="datatools">
<button class="btn btn-add adminonly" onclick="openAdd()">＋ 추가</button>
<button class="btn btn-exp" onclick="exportData()">⬇ 엑셀 내보내기</button>
<button class="btn btn-imp adminonly" onclick="document.getElementById('impfile').click()">⬆ 엑셀 불러오기</button>
<input type="file" id="impfile" accept=".xlsx,.xls" style="display:none" onchange="importData(this)">

</div>

<div class="bar">
<input class="search" id="q" type="text" placeholder="🔍 센터명 · 대표자 · 전화번호 · 주소 · 이메일 검색" oninput="render()">

<div class="tablewrap">
<table>
<thead>
<tr>

<th class="col-code sortable" onclick="setSort('code')">코드<span class="sar" id="sa_code"></span></th>
<th class="sortable" onclick="setSort('name')">센터명<span class="sar" id="sa_name"></span></th>

<th class="sortable" onclick="setSort('tel')">전화번호<span class="sar" id="sa_tel"></span></th>

<th class="col-addr sortable" onclick="setSort('addr')">주소<span class="sar" id="sa_addr"></span></th>
<th class="sortable" onclick="setSort('gubun')">구분<span class="sar" id="sa_gubun"></span></th>
<th class="col-upd sortable" onclick="setSort('updated_at')">수정일<span class="sar" id="sa_updated_at"></span></th>

</tr>

<th class="chk"></th>
<th class="col-code"><input class="fin" id="fx_code" oninput="render()" placeholder="코드"></th>
<th><input class="fin" id="fx_name" oninput="render()" placeholder="센터명"></th>
<th><input class="fin" id="fx_rep" oninput="render()" placeholder="대표자"></th>
<th><input class="fin" id="fx_tel" oninput="render()" placeholder="전화번호"></th>
<th><input class="fin" id="fx_email" oninput="render()" placeholder="이메일"></th>

<div class="selbar" id="selbar">

<div class="field"><label>비밀번호</label><input id="l_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. 설정 — Supabase 정보를 여기에 입력하세요
   ============================================================ */
const SUPABASE_URL      = "https://efxcylnuncyvlassnicg.supabase.co";   // 예: https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_o78IiuUyDteuIe1657LktA_ZnrYd_Kx";   // Project Settings > API > anon public key

/* 관리자 아이디 뒤에 자동으로 붙는 도메인.
   Supabase Auth는 이메일 형식을 요구하므로, 화면에서는 "admin" 만 입력받고
   내부적으로 "admin@cuckoo.local" 로 변환해 로그인합니다.
   Supabase > Authentication > Users 에 이 형태로 계정을 만들어 두세요. */
const ADMIN_ID_DOMAIN = "cuckoo.local";

/* 로컬 모드(=Supabase 미설정) 전용 임시 비밀번호.
   소스에 그대로 노출되므로 테스트 용도로만 쓰세요. */
const LOCAL_ADMIN_PW = "cuckoo2026";
/* ============================================================ */

const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const LIB_OK = !!(window.supabase && window.supabase.createClient) && !window.__sbFail;
const LS_KEY = "cuckoo_addrbook_v2";
const SEED_DATE = "2026-01-01T00:00:00Z";

let sb = null;
if (CLOUD && LIB_OK) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SEED = [];

let DATA = [];
let curCat = "전체";
let sortKey = null;   // null이면 코드 오름차순(기본)
let sortDir = 1;      // 1=오름차순, -1=내림차순
let filterOn = false;
let editCode = null;
let isAdmin = false;
let ready = false;
const sel = new Set();

/* ---------- 공통 ---------- */
/* 엑셀에 흔히 쓰는 구분을 먼저 보여주고, 그 외 값은 뒤에 이름순으로 붙입니다.
   목록에 없는 구분이 들어와도 탭이 자동으로 생깁니다. */
const GUBUN_ORDER = ["설치법인","일반점","직영점","대행점"];
function gubunList(){
  const seen=[];
  DATA.forEach(r=>{ if(r.gubun && seen.indexOf(r.gubun)<0) seen.push(r.gubun); });
  return GUBUN_ORDER.filter(g=>seen.indexOf(g)>=0)
    .concat(seen.filter(g=>GUBUN_ORDER.indexOf(g)<0).sort());
}
function fillGubunSelect(selected){
  const list=gubunList();
  const opts=list.length?list:GUBUN_ORDER.slice();
  if(selected && opts.indexOf(selected)<0) opts.push(selected);
  const el=document.getElementById('f_gubun');
  el.innerHTML=opts.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
  el.value = selected && opts.indexOf(selected)>=0 ? selected : opts[0];
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.className='toast',2600);
}
function fmtDate(s){
  if(!s) return '-';
  const d=new Date(s); if(isNaN(d)) return '-';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateTime(s){
  if(!s) return '';
  const d=new Date(s); if(isNaN(d)) return '';
  return fmtDate(s)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function isFresh(s){
  if(!s) return false;
  return (Date.now()-new Date(s).getTime()) < 7*24*3600*1000;
}
function nowISO(){return new Date().toISOString();}

/* ---------- 데이터 로드 ---------- */
let loadErr=null;   // 마지막 실패 사유 (null이면 정상)

function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('__timeout__')),ms))]);
}

/* 쓰기 작업 공통 실행기.
   응답이 없으면 25초 뒤 포기하고 이유를 알려줍니다(무한 대기 방지). */
/* 세션 관련: 응답이 없어도 화면이 멈추지 않게 짧게 끊고 넘어갑니다 */
async function safeSession(){
  try{ const r=await withTimeout(sb.auth.getSession(),10000); return (r&&r.data&&r.data.session)||null; }
  catch(e){ return null; }
}
async function safeSignOut(){
  try{ await withTimeout(sb.auth.signOut(),10000); }catch(e){}
}

async function runWrite(promise){
  try{
    const res=await withTimeout(promise,25000);
    if(res && res.error) return {ok:false,msg:res.error.message};
    return {ok:true,data:(res&&res.data)||[]};
  }catch(e){
    if(e&&e.message==='__timeout__')
      return {ok:false,msg:'서버 응답이 없습니다. 데이터베이스가 절전 상태일 수 있으니 잠시 후 다시 시도해 주세요',timeout:true};
    return {ok:false,msg:(e&&e.message)||'알 수 없는 오류'};
  }
}

async function loadData(){
  loadErr=null;
  if(CLOUD){
    if(!LIB_OK){ loadErr='lib'; DATA=[]; return; }
    // 최대 3회 시도 (절전 해제 대기용으로 점점 길게)
    const waits=[8000,12000,20000];
    for(let i=0;i<waits.length;i++){
      try{
        const {data,error}=await withTimeout(
          sb.from('addressbook').select('*').order('code',{ascending:true}), waits[i]);
        if(error) throw new Error(error.message);
        DATA=data||[]; loadErr=null; return;
      }catch(e){
        loadErr=(e&&e.message==='__timeout__')?'timeout':((e&&e.message)||'unknown');
        if(i<waits.length-1) await new Promise(r=>setTimeout(r,1500));
      }
    }
    DATA=[]; return;
  }else{
    let d=null;
    try{const s=localStorage.getItem(LS_KEY); if(s) d=JSON.parse(s);}catch(e){}
    if(!d) d=SEED.map(r=>Object.assign({},r,{updated_at:SEED_DATE}));
    DATA=d;
  }
}
function saveLocal(){
  if(CLOUD) return true;
  try{localStorage.setItem(LS_KEY,JSON.stringify(DATA));return true;}
  catch(e){toast('브라우저 저장이 차단됐습니다 — 새로고침하면 사라집니다',true);return false;}
}

/* ---------- 권한 ---------- */
function applyRole(){
  document.querySelectorAll('.adminonly').forEach(el=>el.style.display=isAdmin?'':'none');
  document.getElementById('logoutbtn').style.display=isAdmin?'':'none';
  const b=document.getElementById('modebadge');
  if(isAdmin){b.className='badge-mode mode-admin';b.textContent='관리자';}
  else if(CLOUD){b.className='badge-mode mode-cloud';b.textContent='읽기 전용';}

/* 관리자 자격 확인.
   addrbook_admins 화이트리스트를 설치했으면 그 결과를 따르고,
   설치하지 않았으면(단순 모드) 로그인만으로 관리자로 봅니다. */
async function checkAdmin(session){
  if(!session) return false;
  try{
    const {data,error}=await sb.rpc('is_addrbook_admin');
    if(error) return true;
    return !!data;
  }catch(e){ return true; }
}

async function doLogin(){
  const pw=document.getElementById('l_pw').value;
  const btn=document.getElementById('loginbtn');
  if(CLOUD){
    const raw=document.getElementById('l_email').value.trim();
    if(!raw||!pw){toast('아이디와 비밀번호를 입력하세요',true);return;}
    // "admin" -> "admin@cuckoo.local" (이미 @가 있으면 그대로 사용)
    const em = raw.includes('@') ? raw : raw + '@' + ADMIN_ID_DOMAIN;
    btn.disabled=true; btn.textContent='확인 중…';
    let data=null,error=null;
    try{
      const r=await withTimeout(sb.auth.signInWithPassword({email:em,password:pw}),25000);
      data=r.data; error=r.error;
    }catch(e){
      btn.disabled=false; btn.textContent='로그인';
      toast('서버 응답이 없습니다. 잠시 후 다시 시도해 주세요',true); return;
    }
    btn.disabled=false; btn.textContent='로그인';
    if(error){toast('로그인 실패 — 아이디 또는 비밀번호를 확인하세요',true);return;}
    const session=(data && data.session) || (await safeSession());
    if(!await checkAdmin(session)){
      await safeSignOut();
      toast('이 계정에는 주소록 수정 권한이 없습니다',true);
      return;
    }
    isAdmin=true;
  }else{
    if(pw!==LOCAL_ADMIN_PW){toast('비밀번호가 올바르지 않습니다',true);return;}
    isAdmin=true;
  }
  closeLogin(); applyRole(); render();
  toast('관리자로 로그인했습니다');
}
async function doLogout(){
  if(CLOUD) await safeSignOut();
  isAdmin=false; applyRole(); render();
  toast('로그아웃했습니다');
}

/* ---------- 렌더 ---------- */
function setTab(c){ curCat=c; render(); }

/* 헤더 클릭: 오름차순 -> 내림차순 -> 해제(기본순서) 순환 */
const SORT_KEYS=['code','name','rep','tel','email','addr','gubun','updated_at'];
function setSort(k){
  if(sortKey===k){
    if(sortDir===1) sortDir=-1;
    else { sortKey=null; sortDir=1; }
  }else{ sortKey=k; sortDir=1; }
  render();
}
function updateSortArrows(){
  SORT_KEYS.forEach(k=>{
    const el=document.getElementById('sa_'+k);
    if(el) el.textContent = (sortKey===k) ? (sortDir===1?'▲':'▼') : '';
    const th=el?el.parentNode:null;
    if(th) th.classList.toggle('sorted', sortKey===k);
  });
}
function sortRows(list){
  if(!sortKey) return list;
  return list.slice().sort((a,b)=>{
    const va=a[sortKey]||'', vb=b[sortKey]||'';
    if(sortKey==='updated_at') return (va<vb?-1:va>vb?1:0)*sortDir;
    // 빈 값은 항상 뒤로
    if(!va&&vb) return 1;
    if(va&&!vb) return -1;
    return String(va).localeCompare(String(vb),'ko',{numeric:true,sensitivity:'base'})*sortDir;
  });
}

async function retryLoad(){
  document.getElementById('loadfail').style.display='none';
  const ld=document.getElementById('loading');
  ld.style.display='block'; ld.textContent='다시 불러오는 중…';
  await loadData();
  ld.textContent='불러오는 중…';
  render();
  if(!loadErr) toast('불러왔습니다 ('+DATA.length+'건)');
}

function toggleFilter(){
  filterOn=!filterOn;
  document.getElementById('filterrow').style.display = filterOn?'':'none';
  document.getElementById('filterbtn').classList.toggle('on',filterOn);
  if(!filterOn) clearColFilters(true);
  render();
}
function clearColFilters(skipRender){
  SORT_KEYS.forEach(k=>{ const el=document.getElementById('fx_'+k); if(el) el.value=''; });
  if(!skipRender) render();
}
function colFilters(){
  if(!filterOn) return null;
  const o={};
  SORT_KEYS.forEach(k=>{
    const el=document.getElementById('fx_'+k);
    const v=el?el.value.trim().toLowerCase():'';
    if(v) o[k]=v;
  });
  return Object.keys(o).length?o:null;
}
/* 구분 필터 목록을 데이터에 맞춰 유지 (선택값은 보존) */
function syncGubunFilter(){
  const el=document.getElementById('fx_gubun'); if(!el) return;
  const list=gubunList(), sig=list.join('|');
  if(el.dataset.sig===sig) return;
  const cur=el.value;
  el.dataset.sig=sig;
  el.innerHTML='<option value="">(전체)</option>'
    +list.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
  el.value = list.indexOf(cur)>=0 ? cur : '';
}

function renderTabs(){
  const list=gubunList();
  const items=[{k:'전체',n:DATA.length}]
    .concat(list.map(g=>({k:g,n:DATA.filter(r=>r.gubun===g).length})));
  if(items.length>1 && list.indexOf(curCat)<0 && curCat!=='전체') curCat='전체';
  document.getElementById('tabs').innerHTML=items.map(it=>
    '<button class="tab'+(it.k===curCat?' active':'')+'" data-cat="'+esc(it.k)+'"'
    +' onclick="setTab(\''+esc(it.k)+'\')">'+esc(it.k)+' ('+it.n+')</button>').join('');
}
function gbadge(g){return '<span class="gbadge g'+esc(g)+'">'+esc(g)+'</span>';}

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=colFilters();
  const list=DATA.filter(r=>{
    if(curCat!=="전체" && r.gubun!==curCat) return false;
    if(q && !((r.name||'')+(r.rep||'')+(r.tel||'')+(r.addr||'')+(r.email||'')+(r.code||'')).toLowerCase().includes(q)) return false;
    if(f){
      for(const k in f){
        const raw = (k==='updated_at') ? fmtDate(r.updated_at) : (r[k]||'');
        const v = String(raw).toLowerCase();
        if(k==='gubun'){ if(v!==f[k]) return false; }
        else if(v.indexOf(f[k])<0) return false;
      }
    }
    return true;
  });
  return sortRows(list);
}

function render(){
  const list=filtered();
  document.getElementById('tbody').innerHTML=list.map(r=>{
    const isSel=sel.has(r.code);
    const c=esc(r.code);
    return '<tr class="'+(isSel?'sel':'')+'">'
      +'<td class="chk"><input type="checkbox" '+(isSel?'checked':'')+' onclick="toggleOne(\''+c+'\')"></td>'
      +'<td class="code col-code">'+c+'</td>'
      +'<td class="name">'+esc(r.name)+'</td>'
      +'<td>'+esc(r.rep)+'</td>'
      +'<td class="tel">'+(esc(r.tel)||'-')+'</td>'
      +'<td class="email">'+esc(r.email)+'</td>'
      +'<td class="addr col-addr">'+esc(r.addr)+'</td>'
      +'<td>'+gbadge(r.gubun)+'</td>'
      +'<td class="upd col-upd'+(isFresh(r.updated_at)?' fresh':'')+'" title="'+esc(fmtDateTime(r.updated_at))+'">'+fmtDate(r.updated_at)+'</td>'
      +(isAdmin
        ? '<td class="acts adminonly"><button class="btn btn-sm btn-edit" onclick="openEdit(\''+c+'\')">수정</button> '
          +'<button class="btn btn-sm btn-del" onclick="delRow(\''+c+'\')">삭제</button></td>'
        : '')
      +'</tr>';
  }).join('');
  document.getElementById('loading').style.display='none';
  const failBox=document.getElementById('loadfail');
  if(loadErr && DATA.length===0){
    let m;
    if(loadErr==='lib'){
      m='필요한 스크립트를 불러오지 못했습니다.<br>회사 네트워크나 브라우저 확장이 <b>cdn.jsdelivr.net</b> 접속을 막고 있을 수 있습니다.';
    }else if(loadErr==='timeout'){
      m='서버 응답이 없습니다.<br>데이터베이스가 절전 상태일 수 있습니다. 잠시 후 다시 시도해 주세요.<br><span style="font-size:12px">계속 반복되면 Supabase에서 프로젝트 복구가 필요합니다.</span>';
    }else{
      m='데이터를 불러오지 못했습니다.<br><span style="font-size:11px;color:#aaa">'+esc(loadErr)+'</span>';
    }
    document.getElementById('failmsg').innerHTML=m;
    failBox.style.display='block';
    document.getElementById('empty').style.display='none';
  }else{
    failBox.style.display='none';
    document.getElementById('empty').style.display=list.length?'none':'block';
  }
  document.getElementById('showcnt').textContent=list.length;
  document.getElementById('allchk').checked=list.length>0 && list.every(r=>sel.has(r.code));
  renderTabs();
  updateSortArrows();
  syncGubunFilter();
  let mx=null; DATA.forEach(r=>{if(r.updated_at&&(!mx||r.updated_at>mx))mx=r.updated_at;});
  document.getElementById('lastupd').textContent=mx?fmtDateTime(mx):'-';
  updateSel();
}

function toggleOne(id){sel.has(id)?sel.delete(id):sel.add(id);render();}
function toggleAll(cb){filtered().forEach(r=>cb.checked?sel.add(r.code):sel.delete(r.code));render();}
function clearSel(){sel.clear();render();}

function selEmails(){
  const seen=new Set(),out=[];
  DATA.forEach(r=>{if(sel.has(r.code)&&r.email&&!seen.has(r.email)){seen.add(r.email);out.push(r.email);}});
  return out;
}
function updateSel(){
  const e=selEmails();
  document.getElementById('selcnt').textContent=sel.size;
  document.getElementById('selbarcnt').textContent=e.length;
  const bar=document.getElementById('selbar'),out=document.getElementById('emailout');
  if(sel.size>0){bar.classList.add('show');out.classList.add('show');out.value=e.join('; ');}
  else{bar.classList.remove('show');out.classList.remove('show');out.value='';}
}
function copyEmails(){
  const e=selEmails();
  if(!e.length){toast('선택된 이메일이 없습니다',true);return;}
  const txt=e.join('; ');
  navigator.clipboard.writeText(txt).then(()=>toast('이메일 '+e.length+'개를 복사했습니다'))
  .catch(()=>{const o=document.getElementById('emailout');o.select();document.execCommand('copy');toast('이메일 '+e.length+'개를 복사했습니다');});

async function saveModal(){
  if(!isAdmin)return;
  const code=document.getElementById('f_code').value.trim();
  const name=document.getElementById('f_name').value.trim();
  const gubun=document.getElementById('f_gubun').value;
  if(!code||!name){toast('코드와 센터명은 필수입니다',true);return;}
  if(editCode===null && DATA.some(x=>x.code===code)){toast('이미 있는 코드입니다',true);return;}

  const obj={
    code:code, name:name,
    rep:document.getElementById('f_rep').value.trim(),
    tel:document.getElementById('f_tel').value.trim(),
    email:document.getElementById('f_email').value.trim(),
    addr:document.getElementById('f_addr').value.trim(),
    gubun:gubun
  };
  const btn=document.getElementById('savebtn');
  btn.disabled=true; btn.textContent='저장 중…';

  if(CLOUD){
    const r=await runWrite(sb.from('addressbook').upsert(obj,{onConflict:'code'}).select('code'));
    btn.disabled=false; btn.textContent='저장';
    if(!r.ok){toast('저장하지 못했습니다 — '+r.msg,true);return;}
    if(!r.data.length){toast('저장 권한이 없습니다 (0건 처리) — 다시 로그인해 보세요',true);return;}
    await loadData();
  }else{
    obj.updated_at=nowISO();
    if(editCode===null) DATA.push(obj);
    else DATA[DATA.findIndex(x=>x.code===editCode)]=obj;
    saveLocal();
    btn.disabled=false; btn.textContent='저장';
  }
  closeModal();
  if(curCat!=='전체') curCat=gubun;
  render();
  toast(editCode===null?'추가했습니다':'수정했습니다');
}

async function delRow(code){
  if(!isAdmin)return;
  const r=DATA.find(x=>x.code===code); if(!r)return;
  if(!confirm('['+r.name+'] 항목을 삭제할까요?'))return;
  if(CLOUD){
    const r=await runWrite(sb.from('addressbook').delete().eq('code',code).select('code'));
    if(!r.ok){toast('삭제하지 못했습니다 — '+r.msg,true);return;}
    if(!r.data.length){
      toast('삭제 권한이 없습니다 (0건 처리) — 로그아웃 후 다시 로그인해 보세요',true);

    DATA=DATA.filter(x=>x.code!==code); saveLocal();
  }

}

async function delSelected(){
  if(!isAdmin)return;

  if(!codes.length){toast('선택된 항목이 없습니다',true);return;}

  // 탭을 넘나들며 선택했을 수 있으므로 구분별 건수를 함께 보여줍니다
  const rows=DATA.filter(r=>sel.has(r.code));

  rows.forEach(r=>{const c=r.gubun||'(구분없음)';byCat[c]=(byCat[c]||0)+1;});
  const catTxt=Object.keys(byCat).map(k=>k+' '+byCat[k]+'건').join(' / ');
  const names=rows.slice(0,7).map(r=>' · '+r.name).join('\n');
  const more=rows.length>7?'\n · … 외 '+(rows.length-7)+'건':'';

  if(!confirm('선택한 '+codes.length+'건을 삭제합니다.\n('+catTxt+')\n\n'+names+more+'\n\n※ 되돌릴 수 없습니다. 진행할까요?')) return;

  if(CLOUD){
    const r=await runWrite(sb.from('addressbook').delete().in('code',codes).select('code'));
    if(!r.ok){toast('삭제하지 못했습니다 — '+r.msg,true);return;}
    const n=r.data.length;
    if(n===0){
      toast('삭제 권한이 없습니다 (0건 처리) — 로그아웃 후 다시 로그인해 보세요',true);
      await loadData(); render(); return;
    }
    if(n<codes.length){
      await loadData(); sel.clear(); render();
      toast(codes.length+'건 중 '+n+'건만 삭제됐습니다',true);
      return;
    }
    await loadData();
  }else{
    DATA=DATA.filter(r=>!sel.has(r.code));
    saveLocal();
  }
  sel.clear(); render();
  toast(codes.length+'건을 삭제했습니다');
}

/* ---------- 엑셀 내보내기 / 불러오기 ---------- */
const XLS_HEAD=['코드','센터명','대표자','전화번호','이메일','주소','구분','수정일'];
function exportData(){
  const rows=DATA.map(r=>({'코드':r.code,'센터명':r.name,'대표자':r.rep,'전화번호':r.tel,
    '이메일':r.email,'주소':r.addr,'구분':r.gubun,'수정일':fmtDate(r.updated_at)}));
  const ws=XLSX.utils.json_to_sheet(rows,{header:XLS_HEAD});
  ws['!cols']=[{wch:8},{wch:24},{wch:8},{wch:15},{wch:26},{wch:40},{wch:10},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'주소록');
  const d=new Date(); const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  XLSX.writeFile(wb,'쿠쿠주소록_'+ymd+'.xlsx');
  toast('엑셀로 내보냈습니다 ('+DATA.length+'건)');
}
function pick(r,keys){for(const k of keys){if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()!=='')return String(r[k]).trim();}return '';}

/* 엑셀의 수정일 칸을 ISO 문자열로. 문자열/날짜/엑셀일련번호 모두 처리.
   비었거나 해석 불가면 null (=날짜 정보 없음). */
function parseDateCell(v){
  if(v===undefined||v===null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString();
  if(typeof v==='number' && isFinite(v)){            // 엑셀 일련번호
    const ms=Math.round((v-25569)*86400*1000);
    const d=new Date(ms);
    return isNaN(d)?null:d.toISOString();
  }
  const t=String(v).trim();
  if(!t) return null;
  const m=t.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0);
    return isNaN(d)?null:d.toISOString();
  }
  const d=new Date(t);
  return isNaN(d)?null:d.toISOString();
}

/* 내용 비교용 필드 (수정일은 제외 — 내용이 같으면 날짜를 건드리지 않기 위함) */
const CMP_FIELDS=['name','rep','tel','email','addr','gubun'];
function sameRow(a,b){
  if(!a||!b) return false;
  return CMP_FIELDS.every(k=>String(a[k]||'').trim()===String(b[k]||'').trim());
}

async function importData(input){
  if(!isAdmin){input.value='';return;}
  const file=input.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=async function(){
    let parsed;
    try{
      const wb=XLSX.read(rd.result,{type:'array'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',cellDates:true});
      parsed=raw.map(r=>({
        code:pick(r,['코드','code']),
        name:pick(r,['센터명','name']),
        rep:pick(r,['대표자','rep']),
        tel:pick(r,['전화번호','tel']),
        email:pick(r,['이메일','email']),
        addr:pick(r,['주소','addr']),
        gubun:pick(r,['구분','gubun'])||'일반점',
        _xlsDate:parseDateCell(r['수정일']!==undefined?r['수정일']:r['updated_at'])
      })).filter(r=>r.code&&r.name);
      if(!parsed.length) throw 0;
    }catch(e){
      toast('올바른 엑셀 주소록 파일이 아닙니다',true); input.value=''; return;
    }

    const merge=confirm('불러온 '+parsed.length+'건을 기존 데이터에 [추가·병합]하려면 확인을 누르세요.\n(같은 코드는 갱신, 새 코드는 추가)\n\n※ 취소를 누르면 기존 데이터를 모두 지우고 [전체 교체]합니다.');

    const strip=r=>({code:r.code,name:r.name,rep:r.rep,tel:r.tel,email:r.email,addr:r.addr,gubun:r.gubun});

    if(CLOUD){
      if(!merge){
        // 전체 교체: 지우고 새로 넣습니다. INSERT라 엑셀의 수정일이 그대로 보존됩니다.
        const rd0=await runWrite(sb.from('addressbook').delete().neq('code','__never_match__'));
        if(!rd0.ok){toast('기존 데이터를 지우지 못했습니다 — '+rd0.msg,true);input.value='';return;}
        const payload=parsed.map(r=>{
          const o=strip(r);
          if(r._xlsDate) o.updated_at=r._xlsDate;
          return o;
        });
        const ru=await runWrite(sb.from('addressbook').upsert(payload,{onConflict:'code'}));
        if(!ru.ok){toast('불러오지 못했습니다 — '+ru.msg,true);input.value='';return;}
        await loadData(); sel.clear(); render();
        toast('전체 교체했습니다 ('+parsed.length+'건)');
      }else{
        // 병합: 내용이 실제로 달라진 행과 새 행만 보냅니다.
        const cur=new Map(DATA.map(r=>[r.code,r]));
        const payload=[]; let add=0,upd=0,skip=0;
        parsed.forEach(r=>{
          const old=cur.get(r.code);
          if(old){
            if(sameRow(old,r)){skip++;return;}   // 값이 같으면 건드리지 않음 -> 수정일 유지
            payload.push(strip(r)); upd++;
          }else{
            const o=strip(r);
            if(r._xlsDate) o.updated_at=r._xlsDate;
            payload.push(o); add++;
          }
        });
        if(payload.length){
          const rm=await runWrite(sb.from('addressbook').upsert(payload,{onConflict:'code'}).select('code'));
          if(!rm.ok){toast('불러오지 못했습니다 — '+rm.msg,true);input.value='';return;}
          if(!rm.data.length){toast('저장 권한이 없습니다 (0건 처리) — 다시 로그인해 보세요',true);input.value='';return;}
        }
        await loadData(); sel.clear(); render();
        toast('병합 완료 — 추가 '+add+' / 변경 '+upd+' / 동일 '+skip+'건');
      }
    }else{
      const ts=nowISO();
      if(merge){
        const map=new Map(DATA.map(r=>[r.code,r]));
        let add=0,upd=0,skip=0;
        parsed.forEach(r=>{
          const old=map.get(r.code);
          if(old){
            if(sameRow(old,r)){skip++;return;}          // 값 동일 -> 수정일 유지
            Object.assign(old,strip(r),{updated_at:ts});
            upd++;
          }else{
            const rec=Object.assign(strip(r),{updated_at:r._xlsDate||ts});
            map.set(r.code,rec); DATA.push(rec); add++;
          }
        });
        saveLocal(); sel.clear(); render();
        toast('병합 완료 — 추가 '+add+' / 변경 '+upd+' / 동일 '+skip+'건');
      }else{
        DATA=parsed.map(r=>Object.assign(strip(r),{updated_at:r._xlsDate||ts}));
        saveLocal(); sel.clear(); render();
        toast('전체 교체했습니다 ('+DATA.length+'건)');
      }
    }
    input.value='';
  };
  rd.readAsArrayBuffer(file);
}

/* ---------- 숨은 관리자 진입 ---------- */
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.shiftKey&&(e.key==='A'||e.key==='a')){e.preventDefault();if(!isAdmin)openLogin();}
  if(e.key==='Escape'){closeModal();closeLogin();}
});
(function(){
  let n=0,tm=null;
  document.getElementById('secretdot').addEventListener('click',function(){
    n++; clearTimeout(tm); tm=setTimeout(()=>n=0,1200);
    if(n>=3){n=0; if(!isAdmin) openLogin();}
  });
})();
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('loginmodal').addEventListener('click',function(e){if(e.target===this)closeLogin();});

/* ---------- 시작 ---------- */
(async function init(){
  if(!CLOUD) document.getElementById('setupbox').style.display='';
  if(CLOUD && LIB_OK){
    const session=await safeSession();
    isAdmin=await checkAdmin(session);
    sb.auth.onAuthStateChange(async (_e,s)=>{
      isAdmin=await checkAdmin(s);
      applyRole(); if(ready) render();
    });
  }
  applyRole();
  await loadData();
  ready=true;
  render();
  if(location.hash==='#admin'&&!isAdmin) openLogin();
})();
</script>
